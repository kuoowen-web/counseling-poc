<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>諮商紀錄 PoC</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f6f5e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="諮商紀錄">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root { --c: #2f6f5e; --bg: #f6f7f6; --line: #d9dedb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; background: var(--bg); color: #1d2521; }
    header { background: var(--c); color: #fff; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 17px; margin: 0; }
    main { padding: 16px; max-width: 560px; margin: 0 auto; }
    section { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #56615b; margin: 12px 0 4px; }
    input, textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
    textarea { min-height: 80px; }
    button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--c); color: #fff; }
    button.secondary { background: #e7ecea; color: #1d2521; }
    .row { display: flex; gap: 8px; margin-top: 16px; }
    .rec { border-top: 1px solid var(--line); padding: 10px 0; display: flex; justify-content: space-between; gap: 8px; }
    .rec small { color: #56615b; }
    #status { font-size: 13px; color: #56615b; min-height: 1.4em; }
    #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; color: #56615b; max-height: 180px; overflow: auto; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header><h1>諮商紀錄 PoC</h1><span id="who"></span></header>
  <main>
    <section id="login-box">
      <p>請用診所登記的 Google 帳號登入。</p>
      <div id="gsi-button"></div>
    </section>

    <div id="app" class="hidden">
      <section>
        <strong id="form-title">新增一筆</strong>
        <input type="hidden" id="record_id">
        <label for="service_date">日期</label>
        <input type="date" id="service_date">
        <label for="client_code">個案代號</label>
        <input id="client_code" placeholder="例如 C001">
        <label for="amount">金額</label>
        <input id="amount" type="number" inputmode="numeric">
        <label for="note">紀錄</label>
        <textarea id="note"></textarea>
        <label for="file">附件（選填，Word 或照片）</label>
        <input type="file" id="file" accept="image/*,.doc,.docx,.pdf">
        <div class="row">
          <button id="save">儲存</button>
          <button id="reset" class="secondary">清空</button>
        </div>
        <p id="status"></p>
      </section>

      <section>
        <strong>我的紀錄</strong>
        <div id="list"></div>
      </section>

      <section>
        <strong>速度紀錄</strong>
        <div id="log"></div>
      </section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
